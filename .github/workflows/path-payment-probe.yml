name: path-payment-probe

on:
  schedule:
    # Nightly at 05:00 UTC — half an hour after the refund probe starts, so the
    # two live probes do not hit Horizon testnet at the same moment.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    # The watcher may take ~5 minutes to mark the link paid.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pays a 10 USDC link on testnet with XLM through a
      # pathPaymentStrictReceive built by the checkout's own builder, and
      # checks the watcher marks the link paid and the receipt/CSV record what
      # the buyer spent (issue 5.51).
      #
      # No secrets: both probe wallets are throwaway keys, the buyer is funded
      # by Friendbot (XLM), and the seller only needs Friendbot's XLM plus a
      # USDC trustline the probe adds itself.
      - name: Path payment end-to-end probe (quote → build → pay → receipt)
        id: path
        continue-on-error: true
        env:
          RUN_LIVE_PATH_TESTS: "1"
          PATH_PAYMENTS_ENABLED: "true"
          PATH_PAYMENT_PROBE_BUYER_SECRET: ${{ secrets.TEST_PATH_PAYMENT_BUYER_SECRET }}
          PATH_PAYMENT_PROBE_SELLER_SECRET: ${{ secrets.TEST_PATH_PAYMENT_SELLER_SECRET }}
        run: |
          pnpm --filter @checkout/api exec vitest run test/live/path-payment.live.test.ts --reporter=verbose 2>&1 | tee path-payment-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit ${EXIT_CODE}

      - name: Name the failing suites
        if: steps.path.outputs.exit_code != '0'
        run: node scripts/anchor-probe-report.mjs failing-suites.md path-payment-output.txt

      - name: Publish telemetry summary
        if: always()
        run: |
          TELEMETRY="apps/api/path-payment-probe-telemetry.json"
          {
            echo "## Path Payment Probe Telemetry"
            echo ""
            if [ -f "${TELEMETRY}" ]; then
              echo "| Last stage completed | $(jq -r '.pathLastStage // "none"' "${TELEMETRY}") |"
              echo "| Failed stage | $(jq -r '.pathFailedStage // "none"' "${TELEMETRY}") |"
              echo "| Quoted source amount | $(jq -r '.pathSourceAmount // "N/A"' "${TELEMETRY}") XLM |"
              echo "| sendMax (buyer's cap) | $(jq -r '.pathSendMax // "N/A"' "${TELEMETRY}") XLM |"
              echo "| Actual XLM spent | $(jq -r '.pathSpentXlm // "N/A"' "${TELEMETRY}") |"
              echo "| Price impact | $(jq -r '.pathPriceImpactBps // "N/A"' "${TELEMETRY}") bps |"
              echo "| pay-options Horizon call | $(jq -r '.pathPayOptionsMs // "N/A"' "${TELEMETRY}") ms |"
              echo "| build-time re-quote (2 Horizon calls) | $(jq -r '.pathPlanMs // "N/A"' "${TELEMETRY}") ms |"
              echo "| Submitted → link marked paid | $(jq -r '.pathPaidAfterMs // "N/A"' "${TELEMETRY}") ms |"
              echo "| Payment tx hash | $(jq -r '.pathPayTxHash // "N/A"' "${TELEMETRY}") |"
            else
              echo "| Status | No telemetry emitted (probe may have failed before measurement) |"
            fi
            echo ""
            echo "**Probe exit code:** ${{ steps.path.outputs.exit_code }}"
            echo ""
            echo "Path payment probe: https://github.com/${{ github.repository }}/blob/dev/apps/api/test/live/path-payment.live.test.ts"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: path-payment-probe-results
          path: |
            path-payment-output.txt
            failing-suites.md
            apps/api/path-payment-probe-telemetry.json
          retention-days: 7

      - name: Report success
        if: steps.path.outputs.exit_code == '0'
        run: |
          echo "✅ Path payment probe passed — a 10 USDC link was quoted in XLM, paid with a path payment, settled by the watcher, and recorded on the receipt and CSV" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update failure issue
        if: steps.path.outputs.exit_code != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            let whatBroke = "See the failed run for details.";
            try { whatBroke = fs.readFileSync("failing-suites.md", "utf8").trim(); } catch {}
            const issueTitle = "⚠️ Nightly path-payment probe failed";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const body = `The nightly [path-payment probe](${runUrl}) against Horizon testnet failed.

            ### What broke
            ${whatBroke}

            The probe creates a 10 USDC link, quotes it in XLM through \`GET /links/:id/pay-options\`, builds and submits a \`pathPaymentStrictReceive\` with the checkout's own builder, waits for the watcher to mark the link \`paid\`, then checks the receipt and the seller's CSV export record XLM as what the buyer spent (issue 5.51).

            ### Impact
            - Paying a link in a different asset is **unverified** until the probe passes again.
            - \`PATH_PAYMENTS_ENABLED\` should not be widened on the strength of an unverified path.

            ### Next steps
            1. Review the [workflow run logs](${runUrl}).
            2. Check Horizon testnet reachability and that \`/paths/strict-receive\` still finds an XLM ↔ USDC path (the probe relies on testnet's SDEX liquidity and fabricates none).
            3. If the prepare stage failed, Friendbot may be rate limiting; rerun the workflow.

            _This issue was auto-filed by the [path-payment-probe workflow](https://github.com/${process.env.GITHUB_REPOSITORY}/actions/workflows/path-payment-probe.yml)._`;

            // Find an existing open issue by title (no label dependency).
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find(i => i.title === issueTitle);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Probe failed again on ${new Date().toISOString()}. [View run](${runUrl}).`,
              });
              core.info(`Added failure comment to existing issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body,
              });
              core.info("Created new failure issue");
            }

      # The probe step is continue-on-error so the telemetry and issue steps
      # above still run, which also means the job would otherwise finish green.
      # Fail the run here so the Actions list goes red too.
      - name: Fail the run if the probe failed
        if: steps.path.outputs.exit_code != '0'
        run: |
          echo "::error::Path payment probe failed (exit ${{ steps.path.outputs.exit_code }}). See the filed issue and the path-payment-probe-results artifact."
          exit 1
